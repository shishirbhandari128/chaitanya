<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-98a70415-c33a-4296-991c-e65a2cbfd8c7/styles.css">
  <script src="_ds/modernist-98a70415-c33a-4296-991c-e65a2cbfd8c7/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <script src="./demo-photos.js"></script>
  <script src="./motion.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap');
    :root {
      --color-bg: #f7f1de; --color-text: #072E34; --color-accent: #007D67; --color-accent-700: #045A4A;
      --font-heading: 'El Messiri', sans-serif; --font-body: 'Lato', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; } body { margin: 0; background: #fff; }
    a { color: var(--color-accent); } a:hover { color: var(--color-accent-700); }
    .chy-card { position: relative; }
    .chy-card .chy-media img, .chy-card .chy-media image-slot { transition: transform 0.7s cubic-bezier(.2,.7,.2,1); display: block; }
    .chy-card:hover .chy-media { transform: scale(1.04); }
    .chy-media { transition: transform 0.7s cubic-bezier(.2,.7,.2,1); overflow: hidden; }
    .chy-info-default, .chy-info-hover { transition: opacity 0.35s ease, transform 0.35s ease; }
    .chy-info-hover { opacity: 0; transform: translateY(8px); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .chy-card:hover .chy-info-default { opacity: 0; transform: translateY(-6px); }
    .chy-card:hover .chy-info-hover { opacity: 1; transform: translateY(0); }
  </style>
</helmet>

<dc-import name="SiteHeader" current-page="services" hint-size="100%,76px" style="position:sticky;top:0;z-index:40;"></dc-import>

<section style="background:#f7f1de;padding:calc(2.4*var(--space-8)) clamp(20px,6vw,120px) calc(2.4*var(--space-8));">
  <p style="font-family:var(--font-body);font-size:13px;color:#5c6a4a;margin:0 0 var(--space-3);">
    <a href="Chaitanya Landing.dc.html" style="text-decoration:none;color:inherit;">Home</a> &nbsp;/&nbsp; <span style="color:#072E34;">Services</span>
  </p>
  <h1 style="font-family:var(--font-heading);font-weight:700;font-size:clamp(28px,4.4vw,52px);color:#201e1d;margin:0 0 var(--space-3);">Treatments &amp; Wellness Products</h1>
  <p style="font-family:var(--font-body);font-size:16px;line-height:1.6;color:#2F4A47;max-width:64ch;margin:0;">Explore our range of spa services and naturopathy products crafted for your mind, body, and spirit.</p>
</section>

<section style="background:#fff;padding:calc(2.4*var(--space-8)) clamp(20px,6vw,120px) calc(2.4*var(--space-8));">
  <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:calc(1.4*var(--space-8));padding:14px 0;background:transparent;border-radius:0;border-bottom:1px solid #e4e2dc;">
    <select onChange="{{ onCategoryChange }}" value="{{ activeCategory }}" style="font-family:var(--font-body);font-size:14px;font-weight:600;color:#072E34;background:#fff;border:1px solid #e4e2dc;border-radius:8px;padding:0 16px;height:44px;box-sizing:border-box;line-height:44px;cursor:pointer;min-width:0;flex:1 1 160px;max-width:220px;">
      <sc-for list="{{ categoryOptions }}" as="cat" hint-placeholder-count="7">
        <option value="{{ cat }}">{{ cat }}</option>
      </sc-for>
    </select>
    <select onChange="{{ onPriceChange }}" value="{{ activePriceRange }}" style="font-family:var(--font-body);font-size:14px;font-weight:600;color:#072E34;background:#fff;border:1px solid #e4e2dc;border-radius:8px;padding:0 16px;padding-right:36px;height:44px;box-sizing:border-box;line-height:44px;cursor:pointer;min-width:0;flex:1 1 160px;max-width:220px;margin-right:12px;">
      <sc-for list="{{ priceRangeOptions }}" as="pr" hint-placeholder-count="4">
        <option value="{{ pr.value }}">{{ pr.label }}</option>
      </sc-for>
    </select>
    <div style="flex:1 1 12px;min-width:12px;"></div>
    <button type="button" onClick="{{ onSearchClick }}" aria-label="Search" style="display:flex;align-items:center;justify-content:flex-start;gap:8px;width:44px;height:44px;padding:0 13px;box-sizing:border-box;border:none;border-radius:99px;background:#007D67;color:#fff;cursor:pointer;flex:none;overflow:hidden;white-space:nowrap;transition:width 0.35s cubic-bezier(0.16,1,0.3,1),padding 0.35s cubic-bezier(0.16,1,0.3,1);margin-left:auto;" style-hover="width:212px;padding:0 20px;" style-active="width:212px;padding:0 20px;transform:scale(0.98);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <span style="font-family:var(--font-body);font-size:14px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity 0.35s cubic-bezier(0.16,1,0.3,1);" style-hover="opacity:1;">Search All Services</span>
    </button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;">
    <sc-for list="{{ visibleItems }}" as="item" hint-placeholder-count="8">
      <a href="{{ item.actionHref }}" class="chy-card" style="display:block;text-decoration:none;color:inherit;">
        <figure class="chy-media" style="margin:0;position:relative;">
          <image-slot id="{{ item.slotId }}" shape="rect" placeholder="{{ item.label }}" style="width:100%;aspect-ratio:4/5;"></image-slot>
          <div style="position:absolute;top:0;left:0;right:0;height:60%;background:linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 100%);pointer-events:none;"></div>
          <span style="position:absolute;top:14px;left:14px;right:14px;color:#fff;font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,0.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ item.category }}</span>
          <sc-if value="{{ item.isService }}" hint-placeholder-val="{{ true }}">
            <span style="position:absolute;bottom:12px;right:12px;background:rgba(32,30,29,0.8);color:#fff;font-family:var(--font-body);font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;">{{ item.duration }}</span>
          </sc-if>
        </figure>
        <div style="position:relative;background:#f5f6f4;padding:16px;min-height:76px;">
          <div class="chy-info-default" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <h3 style="font-family:var(--font-heading);font-weight:600;font-size:15.5px;margin:0;color:#201e1d;">{{ item.name }}</h3>
            <span style="flex:none;font-family:var(--font-body);font-size:13px;font-weight:700;color:#007D67;">{{ item.priceLabel }}</span>
          </div>
          <div class="chy-info-hover">
            <span style="display:flex;align-items:center;gap:8px;background:#007D67;color:#fff;font-family:var(--font-body);font-weight:600;font-size:14px;text-decoration:none;padding:10px 24px;border-radius:999px;">
              {{ item.actionLabel }}
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M13.376 18.014a.933.933 0 01-.593-.227.933.933 0 01-.031-1.31l3.906-4.167H4.933C4.426 12.31 4 11.884 4 11.376c0-.507.426-.933.933-.933h11.725l-3.906-4.167a.933.933 0 01.031-1.31c.383-.343.98-.323 1.323.031l4.902 5.24a1.005 1.005 0 010 1.377l-4.902 5.24a.933.933 0 01-.73.32z"></path></svg>
            </span>
          </div>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:calc(1.6*var(--space-8));flex-wrap:wrap;">
    <button type="button" onClick="{{ onPrevPage }}" disabled="{{ isFirstPage }}" aria-label="Previous page" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:99px;border:1px solid #e4e2dc;background:#fff;color:#072E34;cursor:pointer;opacity:{{ prevOpacity }};">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <sc-for list="{{ pageNumbers }}" as="p" hint-placeholder-count="3">
      <button type="button" onClick="{{ p.onClick }}" style="{{ p.style }}width:40px;height:40px;border-radius:99px;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;">{{ p.label }}</button>
    </sc-for>
    <button type="button" onClick="{{ onNextPage }}" disabled="{{ isLastPage }}" aria-label="Next page" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:99px;border:1px solid #e4e2dc;background:#fff;color:#072E34;cursor:pointer;opacity:{{ nextOpacity }};">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </button>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,600px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1200}}">
class Component extends DCLogic {
  state = { activeCategory: 'All', activePriceRange: 'all', page: 1 };
  PAGE_SIZE = 16;

  allItems() {
    if (this._items) return this._items;
    const svc = (id, name, category, duration, price) => ({ id, name, category, duration, priceLabel: `NPR ${price}`, isService: true, slotId: `svc-${id}`, label: name, actionLabel: 'Book Now', actionHref: `ServiceDetail.dc.html?id=${id}` });
    const prod = (id, name, category, price) => ({ id, name, category, priceLabel: `NPR ${price}`, isService: false, slotId: `prod-${id}`, label: name, actionLabel: 'Add to Cart', actionHref: '#' });
    this._items = [
      svc(1, 'Signature Panchakarma Retreat', 'Featured', '7 days', '45,000'),
      svc(2, 'Aroma Hot Stone Massage', 'Featured', '75 min', '3,800'),
      svc(3, 'Shirodhara Therapy', 'Featured', '60 min', '4,200'),
      svc(4, 'Deep Tissue Relaxation', 'Featured', '60 min', '3,500'),
      svc(5, 'Herbal Body Polish', 'Featured', '45 min', '2,600'),
      svc(6, '3-Day Detox Retreat', 'Lifestyle Wellness Package', '3 days', '18,500'),
      svc(7, 'Stress Recovery Program', 'Lifestyle Wellness Package', '5 sessions', '12,000'),
      svc(8, 'Couples Wellness Package', 'Lifestyle Wellness Package', '90 min', '7,600'),
      svc(9, 'Insomnia Care Package', 'Lifestyle Wellness Package', '4 sessions', '9,800'),
      svc(10, 'Abhyanga Oil Massage', 'Relax and Revitalize', '60 min', '3,200'),
      svc(11, 'Swedish Relaxation Massage', 'Relax and Revitalize', '60 min', '3,000'),
      svc(12, 'Aromatherapy Massage', 'Relax and Revitalize', '75 min', '3,600'),
      svc(13, 'Foot Reflexology', 'Relax and Revitalize', '45 min', '2,200'),
      svc(14, 'Nasya Therapy', 'Wellness Therapies', '30 min', '1,800'),
      svc(15, 'Herbal Steam Therapy', 'Wellness Therapies', '30 min', '1,500'),
      svc(16, 'Yoga & Meditation Session', 'Wellness Therapies', '60 min', '1,200'),
      svc(17, 'Ayurvedic Diet Consultation', 'Wellness Therapies', '45 min', '1,500'),
      svc(18, 'Hydrating Facial', 'Beauty and Salon', '50 min', '2,800'),
      svc(19, 'Anti-Acne Facial Therapy', 'Beauty and Salon', '50 min', '2,900'),
      svc(20, 'Beauty Threading', 'Beauty and Salon', '15 min', '250'),
      svc(21, 'Hair Spa Treatment', 'Beauty and Salon', '45 min', '2,200'),
      svc(22, 'Classic Manicure & Pedicure', 'Beauty and Salon', '60 min', '2,000'),
      prod(1, 'Herbal Massage Oil', 'Wellness Products', '850'),
      prod(2, 'Energy Hot Stone Set', 'Wellness Products', '11,500'),
      prod(3, 'Ayurvedic Face Pack', 'Wellness Products', '650'),
      prod(4, 'Cordyceps Militaris Supplement', 'Wellness Products', '3,000'),
      prod(5, 'Detox Herbal Tea', 'Wellness Products', '450'),
    ];
    return this._items;
  }

  renderVals() {
    const items = this.allItems();
    const cats = ['All', 'Featured', 'Lifestyle Wellness Package', 'Relax and Revitalize', 'Wellness Therapies', 'Beauty and Salon', 'Wellness Products'];
    const active = this.state.activeCategory;
    const priceRanges = [
      { value: 'all', label: 'Any Price', test: () => true },
      { value: 'under3000', label: 'Under NPR 3,000', test: (p) => p < 3000 },
      { value: '3000to10000', label: 'NPR 3,000 - 10,000', test: (p) => p >= 3000 && p <= 10000 },
      { value: 'over10000', label: 'Over NPR 10,000', test: (p) => p > 10000 },
    ];
    const activeRange = priceRanges.find((r) => r.value === this.state.activePriceRange) || priceRanges[0];
    const priceOf = (i) => Number(String(i.priceLabel).replace(/[^0-9]/g, ''));
    const byCategory = active === 'All' ? items : items.filter((i) => i.category === active);
    return {
      categoryOptions: cats,
      priceRangeOptions: priceRanges.map((r) => ({ value: r.value, label: r.label })),
      activePriceRange: this.state.activePriceRange,
      onCategoryChange: (e) => this.setState({ activeCategory: e.target.value, page: 1 }),
      onPriceChange: (e) => this.setState({ activePriceRange: e.target.value, page: 1 }),
      categoryTabs: cats.map((c) => ({
        label: c,
        onClick: () => this.setState({ activeCategory: c }),
        style: { background: '#f0efe9', color: '#072E34', border: 'none' },
      })),
      visibleItems: (() => {
        const filtered = byCategory.filter((i) => activeRange.test(priceOf(i)));
        const totalPages = Math.max(1, Math.ceil(filtered.length / this.PAGE_SIZE));
        const page = Math.min(this.state.page, totalPages);
        this._totalPages = totalPages;
        this._page = page;
        return filtered.slice((page - 1) * this.PAGE_SIZE, page * this.PAGE_SIZE);
      })(),
      pageNumbers: Array.from({ length: this._totalPages || 1 }, (_, idx) => idx + 1).map((n) => ({
        label: String(n),
        onClick: () => this.setState({ page: n }),
        style: n === (this._page || 1)
          ? 'background:#007D67;color:#fff;border:none;'
          : 'background:#fff;color:#072E34;border:1px solid #e4e2dc;',
      })),
      isFirstPage: (this._page || 1) === 1,
      isLastPage: (this._page || 1) === (this._totalPages || 1),
      prevOpacity: (this._page || 1) === 1 ? 0.4 : 1,
      nextOpacity: (this._page || 1) === (this._totalPages || 1) ? 0.4 : 1,
      onPrevPage: () => this.setState((s) => ({ page: Math.max(1, s.page - 1) })),
      onNextPage: () => this.setState((s) => ({ page: Math.min(this._totalPages || 1, s.page + 1) })),
      onSearchClick: () => this.setState({ page: 1 }),
    };
  }
}

</script>
</body>
</html>
