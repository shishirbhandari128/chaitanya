<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-98a70415-c33a-4296-991c-e65a2cbfd8c7/styles.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap');
  </style>
</helmet>

<sc-if value="{{ isSolid }}" hint-placeholder-val="{{ true }}">
  <nav style="position:sticky;top:0;z-index:40;background:#fff;color:#201e1d;display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;gap:clamp(10px,2vw,32px);padding:12px clamp(16px,4vw,120px);box-shadow:0 2px 12px rgba(0,0,0,0.08);">
    <a href="Chaitanya Landing.dc.html" aria-label="Chaitanya home" style="display:flex;align-items:center;text-decoration:none;flex:none;" style-hover="opacity:0.9;">
      <img src="assets/chaitanya-logo.svg" alt="Chaitanya Health &amp; Wellness" style="height:54px;width:auto;display:block;transition:transform .3s ease;">
    </a>
    <div style="flex:1;min-width:180px;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,32px);flex-wrap:wrap;row-gap:6px;">
      <sc-for list="{{ navLinks }}" as="link" hint-placeholder-count="6">
        <a href="{{ link.href }}" aria-current="{{ link.current }}" style="{{ link.solidStyle }}{{ link.solidBorder }}font-family:var(--font-body);font-size:14.5px;text-decoration:none;white-space:nowrap;padding-bottom:4px;transition:color 0.25s ease,border-color 0.25s ease;" style-hover="color:#007D67;border-bottom-color:#007D67;">{{ link.label }}</a>
      </sc-for>
    </div>
    <div style="display:flex;gap:10px;flex:none;align-items:center;">
      <a href="Services.dc.html" aria-label="Search services" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:99px;background:#f0f1ee;color:#201e1d;text-decoration:none;transition:background 0.25s ease,color 0.25s ease;" style-hover="background:#E3F5F0;color:#007D67;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg></a>
      <a href="SignIn.dc.html" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 22px;border-radius:99px;background:#007D67;color:#fff;font-family:var(--font-body);font-weight:600;font-size:14px;text-decoration:none;box-sizing:border-box;transition:background 0.25s ease;" style-hover="background:#046a58;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Sign In</a>
    </div>
  </nav>
</sc-if>

<sc-if value="{{ isOverlay }}" hint-placeholder-val="{{ false }}">
  <nav style="position:relative;z-index:2;background:transparent;color:#fff;display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;gap:clamp(10px,2vw,32px);padding:12px clamp(16px,4vw,120px);margin-top:20px;">
    <a href="Chaitanya Landing.dc.html" aria-label="Chaitanya home" style="display:flex;align-items:center;text-decoration:none;flex:none;" style-hover="opacity:0.9;">
      <img src="assets/chaitanya-logo.svg" alt="Chaitanya Health &amp; Wellness" style="height:54px;width:auto;display:block;transition:transform .3s ease;filter:invert(1) brightness(2);">
    </a>
    <div style="flex:1;min-width:180px;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,32px);flex-wrap:wrap;row-gap:6px;">
      <sc-for list="{{ navLinks }}" as="link" hint-placeholder-count="6">
        <a href="{{ link.href }}" aria-current="{{ link.current }}" style="{{ link.overlayStyle }}{{ link.overlayBorder }}font-family:var(--font-body);font-size:14.5px;text-decoration:none;white-space:nowrap;padding-bottom:4px;transition:opacity 0.25s ease,border-color 0.25s ease;" style-hover="border-bottom-color:#fff;">{{ link.label }}</a>
      </sc-for>
    </div>
    <div style="display:flex;gap:10px;flex:none;align-items:center;">
      <a href="Services.dc.html" aria-label="Search services" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:99px;background:rgba(255,255,255,0.16);color:#fff;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background 0.25s ease;" style-hover="background:rgba(255,255,255,0.28);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg></a>
      <a href="SignIn.dc.html" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 22px;border-radius:99px;background:#fff;color:#007D67;font-family:var(--font-body);font-weight:700;font-size:14px;text-decoration:none;box-sizing:border-box;transition:background 0.25s ease;" style-hover="background:#E3F5F0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Sign In</a>
    </div>
  </nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:84},&quot;currentPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;membership&quot;,&quot;reviews&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;solid&quot;,&quot;options&quot;:[&quot;solid&quot;,&quot;overlay&quot;],&quot;tsType&quot;:&quot;'solid' | 'overlay'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.currentPage || this.props.active || '';
    const overlay = this.props.variant === 'overlay';
    const items = [
      ['home', 'Home', 'Chaitanya Landing.dc.html'],
      ['about', 'About Us', 'AboutUs.dc.html'],
      ['services', 'Services', 'Services.dc.html'],
      ['membership', 'Membership', 'Membership.dc.html'],
      ['reviews', 'Reviews', 'Reviews.dc.html'],
      ['contact', 'Contact', 'ContactUs.dc.html'],
    ];
    return {
      isSolid: !overlay,
      isOverlay: overlay,
      navLinks: items.map(([key, label, href]) => {
        const on = key === active;
        return {
          label, href,
          current: on ? 'page' : undefined,
          solidStyle: `color:${on ? '#007D67' : '#201e1d'};font-weight:${on ? 700 : 500};`,
          overlayStyle: `color:#fff;font-weight:${on ? 700 : 500};text-shadow:0 1px 6px rgba(0,0,0,0.35);`,
          solidBorder: on ? 'border-bottom:2px solid #007D67;' : 'border-bottom:2px solid transparent;',
          overlayBorder: on ? 'border-bottom:2px solid #fff;' : 'border-bottom:2px solid transparent;',
        };
      }),
    };
  }
}
</script>
</body>
</html>
