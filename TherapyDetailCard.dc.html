<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preload" as="image" href="assets/photos/md/spa-woman-flower.jpg" fetchpriority="high">
  <script src="./image-slot.js"></script>
</helmet>
<div style="background:#f5f6f4;border-radius:0;padding:var(--space-6);position:sticky;top:20px;">
  <h3 style="font-family:var(--font-heading);font-weight:700;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;margin:0 0 var(--space-4);color:#201e1d;">Therapy Detail</h3>
  <image-slot src="assets/photos/md/spa-woman-flower.jpg" id="detail-card-photo-main" shape="rect" placeholder="Therapy photo" style="display:block;width:100%;aspect-ratio:16/8;border-radius:0;margin-bottom:var(--space-4);"></image-slot>
  <h4 style="font-family:var(--font-heading);font-weight:700;font-size:16px;line-height:1.35;margin:0 0 var(--space-4);color:#201e1d;">{{ data.name }}</h4>
  <div style="display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span style="display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13.5px;color:#6b6a63;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8577" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path></svg>
        Price
      </span>
      <span style="font-family:var(--font-heading);font-weight:700;font-size:14.5px;color:#201e1d;">{{ data.price }}</span>
    </div>
    <div style="height:1px;background:#e6e4da;"></div>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
      <span style="display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13.5px;color:#6b6a63;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8577" stroke-width="1.8"><path d="M20 10c0 4.99-5.5 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.19 4 14.99 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
        Location
      </span>
      <span style="font-family:var(--font-heading);font-weight:700;font-size:13.5px;color:#201e1d;text-align:right;">Chaitanya Health &amp; Wellness<br><span style="font-family:var(--font-body);font-weight:400;font-size:12px;color:#8a8577;">Bakhundole, Lalitpur</span></span>
    </div>
    <div style="height:1px;background:#e6e4da;"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span style="display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13.5px;color:#6b6a63;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8577" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
        Duration
      </span>
      <span style="font-family:var(--font-heading);font-weight:700;font-size:14.5px;color:#201e1d;">{{ data.duration }}</span>
    </div>
    <div style="height:1px;background:#e6e4da;"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span style="display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13.5px;color:#6b6a63;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8577" stroke-width="1.8"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-3.9 3.6-7 8-7s8 3.1 8 7"></path></svg>
        Therapist
      </span>
      <span style="font-family:var(--font-heading);font-weight:700;font-size:14.5px;color:#201e1d;">{{ data.therapist }}</span>
    </div>
    <div style="height:1px;background:#e6e4da;"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span style="display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13.5px;color:#6b6a63;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8577" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path><path d="M8 2v4"></path><path d="M16 2v4"></path></svg>
        Date
      </span>
      <span style="font-family:var(--font-heading);font-weight:700;font-size:14.5px;color:#201e1d;">{{ data.date }}</span>
    </div>
    <div style="height:1px;background:#e6e4da;"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span style="display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13.5px;color:#6b6a63;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8577" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
        Time
      </span>
      <span style="font-family:var(--font-heading);font-weight:700;font-size:14.5px;color:#201e1d;">{{ data.time }}</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:460},&quot;data&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string,price:string,duration:string,therapist:string,date:string,time:string}&quot;}}"></script>
</body>
</html>
